<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Abtin Badiee — Backend Engineer, .NET and Video-on-Demand at scale">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="55%" stop-color="#f0abfc"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#E535AB"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <radialGradient id="glowPink" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E535AB" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#E535AB" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowPurple" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#512BD4" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#512BD4" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <clipPath id="frame">
      <rect width="1200" height="320" rx="18"/>
    </clipPath>
    <clipPath id="typing">
      <rect class="type" x="60" y="52" width="440" height="26"/>
    </clipPath>
  </defs>

  <style>
    .mono { font-family: 'JetBrains Mono', 'Fira Code', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace; }
    .sans { font-family: 'Segoe UI', 'Inter', -apple-system, 'Helvetica Neue', Ubuntu, Arial, sans-serif; }

    .type { animation: type 2.4s steps(34, end) 0.3s backwards; }
    @keyframes type { from { width: 0; } to { width: 440px; } }


    .fade-1 { animation: rise .9s ease-out 1.2s backwards; }
    .fade-2 { animation: rise .9s ease-out 1.6s backwards; }
    .fade-3 { animation: rise .9s ease-out 2.0s backwards; }
    .fade-4 { animation: rise .9s ease-out 2.4s backwards; }
    @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

    .glow-a { animation: drift 9s ease-in-out infinite alternate; }
    .glow-b { animation: drift 11s ease-in-out infinite alternate-reverse; }
    @keyframes drift { from { transform: translate(0, 0); } to { transform: translate(-60px, 25px); } }

    .ring { transform-origin: 960px 160px; animation: pulse 3s ease-out infinite; }
    .ring.r2 { animation-delay: 1s; }
    .ring.r3 { animation-delay: 2s; }
    @keyframes pulse { from { transform: scale(.55); opacity: .9; } to { transform: scale(1.35); opacity: 0; } }

    .bar { transform-box: fill-box; transform-origin: bottom; animation: eq 1.4s ease-in-out infinite alternate; }
    .b1 { animation-delay: -.2s; } .b2 { animation-delay: -.9s; } .b3 { animation-delay: -.4s; }
    .b4 { animation-delay: -1.1s; } .b5 { animation-delay: -.6s; } .b6 { animation-delay: -1.3s; }
    .b7 { animation-delay: -.1s; } .b8 { animation-delay: -.8s; }
    @keyframes eq { from { transform: scaleY(.25); } to { transform: scaleY(1); } }

    .progress { animation: buffer 4s cubic-bezier(.6,.05,.3,1) infinite; }
    @keyframes buffer { 0% { width: 0; } 70% { width: 240px; } 100% { width: 240px; } }

    .live { animation: live 1.6s ease-in-out infinite; }
    @keyframes live { 50% { opacity: .25; } }
  </style>

  <g clip-path="url(#frame)">
    <rect width="1200" height="320" fill="url(#bg)"/>
    <rect width="1200" height="320" fill="url(#grid)"/>
    <ellipse class="glow-a" cx="1000" cy="60" rx="360" ry="220" fill="url(#glowPurple)"/>
    <ellipse class="glow-b" cx="820" cy="330" rx="320" ry="180" fill="url(#glowPink)"/>

    <!-- terminal prompt -->
    <g class="mono" font-size="17">
      <g clip-path="url(#typing)">
        <text x="60" y="70" fill="#6ee7b7">~/abtin <tspan fill="#94a3b8">$</tspan> <tspan fill="#e2e8f0">dotnet run --profile</tspan></text>
      </g>
    </g>

    <!-- name + title -->
    <text class="sans fade-1" x="58" y="148" font-size="68" font-weight="800" fill="url(#name)" letter-spacing="-1.5">Abtin Badiee</text>
    <text class="sans fade-2" x="60" y="190" font-size="22" font-weight="500" fill="#cbd5e1">Backend Engineer  ·  .NET / C#  ·  Video-on-Demand at scale</text>

    <!-- chips -->
    <g class="mono fade-3" font-size="13" font-weight="600">
      <rect x="60" y="222" width="126" height="30" rx="15" fill="#E535AB" fill-opacity=".14" stroke="#E535AB" stroke-opacity=".55"/>
      <text x="123" y="242" text-anchor="middle" fill="#f9a8d4">microservices</text>
      <rect x="198" y="222" width="104" height="30" rx="15" fill="#7C3AED" fill-opacity=".16" stroke="#a78bfa" stroke-opacity=".55"/>
      <text x="250" y="242" text-anchor="middle" fill="#c4b5fd">streaming</text>
      <rect x="314" y="222" width="134" height="30" rx="15" fill="#0ea5e9" fill-opacity=".14" stroke="#38bdf8" stroke-opacity=".55"/>
      <text x="381" y="242" text-anchor="middle" fill="#7dd3fc">high-throughput</text>
      <rect x="460" y="222" width="104" height="30" rx="15" fill="#10b981" fill-opacity=".14" stroke="#34d399" stroke-opacity=".55"/>
      <text x="512" y="242" text-anchor="middle" fill="#6ee7b7">AI / LLMs</text>
    </g>

    <text class="mono fade-4" x="60" y="286" font-size="13" fill="#64748b">// shipping the backend behind millions of play buttons @ Namava</text>

    <!-- player visual -->
    <g>
      <circle class="ring"    cx="960" cy="160" r="70" fill="none" stroke="#E535AB" stroke-width="2"/>
      <circle class="ring r2" cx="960" cy="160" r="70" fill="none" stroke="#a78bfa" stroke-width="2"/>
      <circle class="ring r3" cx="960" cy="160" r="70" fill="none" stroke="#E535AB" stroke-width="2"/>
      <circle cx="960" cy="160" r="46" fill="url(#accent)"/>
      <path d="M948 138 L978 160 L948 182 Z" fill="#ffffff"/>
    </g>

    <!-- bitrate equalizer -->
    <g transform="translate(1072 118)">
      <rect class="bar b1" x="0"  y="0" width="8" height="84" rx="3" fill="#E535AB"/>
      <rect class="bar b2" x="14" y="0" width="8" height="84" rx="3" fill="#d946ef"/>
      <rect class="bar b3" x="28" y="0" width="8" height="84" rx="3" fill="#c084fc"/>
      <rect class="bar b4" x="42" y="0" width="8" height="84" rx="3" fill="#a78bfa"/>
      <rect class="bar b5" x="56" y="0" width="8" height="84" rx="3" fill="#8b5cf6"/>
      <rect class="bar b6" x="70" y="0" width="8" height="84" rx="3" fill="#7c3aed"/>
      <rect class="bar b7" x="84" y="0" width="8" height="84" rx="3" fill="#6d28d9"/>
      <rect class="bar b8" x="98" y="0" width="8" height="84" rx="3" fill="#5b21b6"/>
    </g>

    <!-- buffer bar -->
    <g class="mono" font-size="12">
      <rect x="840" y="262" width="240" height="4" rx="2" fill="#ffffff" fill-opacity=".1"/>
      <rect class="progress" x="840" y="262" width="240" height="4" rx="2" fill="url(#accent)"/>
      <circle class="live" cx="1100" cy="264" r="4" fill="#ef4444"/>
      <text x="1110" y="268" fill="#94a3b8">LIVE</text>
      <text x="840" y="290" fill="#64748b">1080p · ABR · HLS/DASH</text>
    </g>

    <rect x="0.5" y="0.5" width="1199" height="319" rx="18" fill="none" stroke="#ffffff" stroke-opacity=".08"/>
  </g>
</svg>
